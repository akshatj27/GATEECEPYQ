<!DOCTYPE html>
<html lang="en" class="dark">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Backup/Restore GATE Progress</title>
    <script src="https://cdn.tailwindcss.com"></script>
    <script>
      tailwind.config = {
        darkMode: "class",
      };
    </script>
    <link
      rel="apple-touch-icon"
      sizes="180x180"
      href="favicon/apple-touch-icon.png"
    />
    <link
      rel="icon"
      type="image/png"
      sizes="32x32"
      href="favicon/favicon-32x32.png"
    />
    <link
      rel="icon"
      type="image/png"
      sizes="16x16"
      href="favicon/favicon-16x16.png"
    />
    <link rel="manifest" href="favicon/site.webmanifest" />
    <link
      rel="mask-icon"
      href="favicon/safari-pinned-tab.svg"
      color="#5bbad5"
    />
    <link rel="shortcut icon" href="favicon/favicon.ico" />
    <meta name="msapplication-TileColor" content="#ffffff" />
    <meta name="msapplication-config" content="favicon/browserconfig.xml" />
    <meta name="theme-color" content="#ffffff" />
  </head>
  <body
    class="bg-gray-900 text-gray-100 min-h-screen flex items-center justify-center"
  >
    <div class="bg-gray-800 rounded-xl p-8 max-w-md w-full">
      <h1 class="text-2xl font-bold mb-6 text-center">
        Backup & Restore Progress
      </h1>

      <div class="mb-6">
        <h2 class="text-lg font-semibold mb-2">Backup</h2>
        <p class="text-sm text-gray-400 mb-3">
          Save your progress for both EC and EE (marked questions, answered
          states, and filters) to a JSON file.
        </p>
        <button
          id="backup-btn"
          class="w-full bg-blue-600 hover:bg-blue-700 text-white py-2 px-4 rounded-md transition duration-200"
        >
          Download Backup File
        </button>
      </div>

      <div class="border-t border-gray-700 pt-6">
        <h2 class="text-lg font-semibold mb-2">Restore</h2>
        <p class="text-sm text-gray-400 mb-3">
          Restore your progress from a backup file. This will merge with your
          current saved progress for both EC and EE.
        </p>
        <input
          type="file"
          id="restore-input"
          accept=".json"
          class="w-full text-sm text-gray-300 file:mr-4 file:py-2 file:px-4 file:rounded-md file:border-0 file:text-sm file:font-semibold file:bg-gray-700 file:text-gray-200 hover:file:bg-gray-600 mb-3"
        />
        <button
          id="restore-btn"
          class="w-full bg-green-600 hover:bg-green-700 text-white py-2 px-4 rounded-md transition duration-200 disabled:bg-gray-500"
          disabled
        >
          Restore from File
        </button>
      </div>

      <div id="status-message" class="mt-6 text-center text-sm"></div>
    </div>

    <script>
      document.addEventListener("DOMContentLoaded", () => {
        const backupBtn = document.getElementById("backup-btn");
        const restoreInput = document.getElementById("restore-input");
        const restoreBtn = document.getElementById("restore-btn");
        const statusMessage = document.getElementById("status-message");

        // Enable restore button only when a file is selected
        restoreInput.addEventListener("change", () => {
          restoreBtn.disabled = !restoreInput.files.length;
        });

        // Backup functionality
        backupBtn.addEventListener("click", () => {
          try {
            // Collect all GATE-related data from localStorage
            const backupData = {
              // EC data (original keys for backward compatibility)
              markedQuestions: JSON.parse(
                localStorage.getItem("markedQuestions") || "[]"
              ),
              questionStates: JSON.parse(
                localStorage.getItem("questionStates") || "{}"
              ),
              gateQuestionFilters: JSON.parse(
                localStorage.getItem("gateQuestionFilters") || "{}"
              ),

              // EE data (with ee- prefix)
              "ee-markedQuestions": JSON.parse(
                localStorage.getItem("ee-markedQuestions") || "[]"
              ),
              "ee-questionStates": JSON.parse(
                localStorage.getItem("ee-questionStates") || "{}"
              ),
              "ee-gateQuestionFilters": JSON.parse(
                localStorage.getItem("ee-gateQuestionFilters") || "{}"
              ),

              // Calculator state (shared between both)
              calculatorVisible:
                localStorage.getItem("calculatorVisible") || "false",

              // Metadata
              backupDate: new Date().toISOString(),
              version: "2.0",
              subjects: ["EC", "EE"],
            };

            const blob = new Blob([JSON.stringify(backupData, null, 2)], {
              type: "application/json",
            });
            const url = URL.createObjectURL(blob);
            const a = document.createElement("a");
            a.href = url;
            a.download = `gate_progress_backup_${
              new Date().toISOString().split("T")[0]
            }.json`;
            document.body.appendChild(a);
            a.click();
            document.body.removeChild(a);
            URL.revokeObjectURL(url);

            statusMessage.textContent =
              "Backup file generated successfully! Includes data for both EC and EE.";
            statusMessage.className = "mt-6 text-center text-sm text-green-400";
          } catch (error) {
            console.error("Backup failed:", error);
            statusMessage.textContent =
              "Error creating backup file. Check console for details.";
            statusMessage.className = "mt-6 text-center text-sm text-red-400";
          }
        });

        // Restore functionality
        restoreBtn.addEventListener("click", () => {
          if (!restoreInput.files.length) {
            alert("Please select a backup file first.");
            return;
          }

          const file = restoreInput.files[0];
          const reader = new FileReader();

          reader.onload = (event) => {
            try {
              const backupData = JSON.parse(event.target.result);

              // Handle both old format (v1.0) and new format (v2.0)
              let restoredCount = 0;

              // EC data restoration
              if (backupData.markedQuestions) {
                const existingMarked = JSON.parse(
                  localStorage.getItem("markedQuestions") || "[]"
                );
                const backupMarked = backupData.markedQuestions || [];
                const mergedMarked = Array.from(
                  new Set([...existingMarked, ...backupMarked])
                );
                localStorage.setItem(
                  "markedQuestions",
                  JSON.stringify(mergedMarked)
                );
                restoredCount++;
              }

              if (backupData.questionStates) {
                const existingStates = JSON.parse(
                  localStorage.getItem("questionStates") || "{}"
                );
                const backupStates = backupData.questionStates || {};
                const mergedStates = { ...existingStates, ...backupStates };
                localStorage.setItem(
                  "questionStates",
                  JSON.stringify(mergedStates)
                );
                restoredCount++;
              }

              if (backupData.gateQuestionFilters) {
                localStorage.setItem(
                  "gateQuestionFilters",
                  JSON.stringify(backupData.gateQuestionFilters)
                );
                restoredCount++;
              }

              // EE data restoration
              if (backupData["ee-markedQuestions"]) {
                const existingEEMarked = JSON.parse(
                  localStorage.getItem("ee-markedQuestions") || "[]"
                );
                const backupEEMarked = backupData["ee-markedQuestions"] || [];
                const mergedEEMarked = Array.from(
                  new Set([...existingEEMarked, ...backupEEMarked])
                );
                localStorage.setItem(
                  "ee-markedQuestions",
                  JSON.stringify(mergedEEMarked)
                );
                restoredCount++;
              }

              if (backupData["ee-questionStates"]) {
                const existingEEStates = JSON.parse(
                  localStorage.getItem("ee-questionStates") || "{}"
                );
                const backupEEStates = backupData["ee-questionStates"] || {};
                const mergedEEStates = {
                  ...existingEEStates,
                  ...backupEEStates,
                };
                localStorage.setItem(
                  "ee-questionStates",
                  JSON.stringify(mergedEEStates)
                );
                restoredCount++;
              }

              if (backupData["ee-gateQuestionFilters"]) {
                localStorage.setItem(
                  "ee-gateQuestionFilters",
                  JSON.stringify(backupData["ee-gateQuestionFilters"])
                );
                restoredCount++;
              }

              // Calculator state restoration
              if (backupData.calculatorVisible) {
                localStorage.setItem(
                  "calculatorVisible",
                  backupData.calculatorVisible
                );
              }

              if (restoredCount > 0) {
                const subjects = [];
                if (backupData.markedQuestions || backupData.questionStates) {
                  subjects.push("EC");
                }
                if (
                  backupData["ee-markedQuestions"] ||
                  backupData["ee-questionStates"]
                ) {
                  subjects.push("EE");
                }

                statusMessage.textContent = `Progress restored successfully for ${subjects.join(
                  " and "
                )}! Please refresh the main page(s).`;
                statusMessage.className =
                  "mt-6 text-center text-sm text-green-400";
                restoreInput.value = ""; // Clear file input
                restoreBtn.disabled = true;
              } else {
                throw new Error("No valid data found in backup file.");
              }
            } catch (error) {
              console.error("Restore failed:", error);
              statusMessage.textContent =
                "Error restoring progress. The file may be invalid or corrupted.";
              statusMessage.className = "mt-6 text-center text-sm text-red-400";
            }
          };

          reader.onerror = () => {
            statusMessage.textContent = "Error reading the file.";
            statusMessage.className = "mt-6 text-center text-sm text-red-400";
          };

          reader.readAsText(file);
        });
      });
    </script>
  </body>
</html>
